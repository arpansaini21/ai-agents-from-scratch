[project]
name = "python-fundamentals"
version = "0.1.0"
description = "This project is to learn python fundamentals required for Agentic applications development"
readme = "README.md"
authors = [
    { name = "arpan saini", email = "arpansaini201@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.3",
]

[project.scripts]
python-fundamentals = "python_fundamentals:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
